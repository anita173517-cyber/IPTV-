
name: StreamX Media3 Pro - Single Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: streamx-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build one release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract the exact StreamX source ZIP
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          EXPECTED_ZIP="StreamX_Media3_Pro_v13.0_Glass_Zap_512MB_Upgraded_Source.zip"

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using Android project already extracted at repository root."
          else
            if [[ ! -f "$GITHUB_WORKSPACE/$EXPECTED_ZIP" ]]; then
              echo "::error::Missing $EXPECTED_ZIP. Upload this exact ZIP to the repository root and commit it."
              echo "Repository root files:"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/streamx-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$GITHUB_WORKSPACE/$EXPECTED_ZIP" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::The ZIP does not contain settings.gradle.kts."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          [[ -f "$PROJECT_DIR/settings.gradle.kts" ]]
          [[ -f "$PROJECT_DIR/build.gradle.kts" ]]
          [[ -f "$PROJECT_DIR/app/build.gradle.kts" ]]
          [[ -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]]
          [[ -f "$PROJECT_DIR/scripts/verify_project.py" ]]

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up compatible Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional existing release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/streamx-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            {
              echo "SIGNING_STORE_FILE=$KEYSTORE_PATH"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "Existing release signing key configured."
          else
            echo "::notice::No release keystore secrets found. The project will use its configured debug signing fallback. This APK may not update an app signed with a different key."
          fi

      - name: Run source structure verification
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -Eeuo pipefail
          python3 "$PROJECT_DIR/scripts/verify_project.py"

      - name: Run Android unit tests
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace \
            -p "$PROJECT_DIR" testDebugUnitTest

      - name: Build the single release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --no-configuration-cache --stacktrace \
            -p "$PROJECT_DIR" assembleRelease \
            -x lint -x lintVitalRelease

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Gradle completed but the expected release APK was not created."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          unzip -t "$APK" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/single_release_out"
          cp "$APK" "$GITHUB_WORKSPACE/single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk"

          echo "APK archive validation passed."
          sha256sum "$GITHUB_WORKSPACE/single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk"
          ls -lh "$GITHUB_WORKSPACE/single_release_out/"

      - name: Upload the single release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v13.0-Glass-Zap-Single-Release
          path: single_release_out/StreamX-Media3-Pro-v13.0-Glass-Zap-512MB.apk
          if-no-files-found: error
          retention-days: 14
